name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: npm install

      - name: Copier PeerJS dans le jeu
        run: cp node_modules/peerjs/dist/peerjs.min.js www/peerjs.min.js

      - name: Creer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Construire l APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renommer l APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SEMMENA.apk

      - name: Publier le lien de telechargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SEMMENA (derniere version)
          body: Telecharge SEMMENA.apk ci-dessous et installe-le sur ton telephone Android.
          files: SEMMENA.apk
          make_latest: true
