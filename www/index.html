<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e3a52">
<title>SEMMENA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu" class="screen">
  <div class="logo">SEMMENA</div>
  <div class="sub">Colonise l'île avec tes amis, de 3 à 6 joueurs</div>
  <label class="lbl">Ton prénom</label>
  <input id="name" maxlength="14" placeholder="Youssef" autocomplete="off">
  <button id="btnHost" class="big primary">Créer une partie</button>
  <div class="or">ou rejoindre avec un code</div>
  <input id="code" maxlength="5" placeholder="CODE" autocapitalize="characters" autocomplete="off">
  <button id="btnJoin" class="big">Rejoindre</button>
  <div id="menuMsg" class="msg"></div>
</div>

<div id="lobby" class="screen hidden">
  <div class="sub">Code de la partie</div>
  <div id="lobbyCode" class="code">-----</div>
  <button id="btnShare" class="big">Partager le code</button>
  <div class="sub" style="margin-top:18px">Joueurs connectés</div>
  <div id="lobbyList"></div>
  <div id="lobbyMsg" class="msg"></div>
  <button id="btnStart" class="big primary hidden">Lancer la partie</button>
</div>

<div id="game" class="screen hidden">
  <div id="players"></div>
  <div id="status"></div>
  <div id="boardwrap"><canvas id="board"></canvas></div>
  <div id="logbar"></div>
  <div id="tradebar" class="hidden"></div>
  <div id="res"></div>
  <div id="actions"></div>
</div>

<div id="modal" class="hidden"><div id="modalbox"></div></div>
<div id="toast"></div>

<script src="peerjs.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
